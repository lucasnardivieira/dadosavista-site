name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run calculator tests (calc.js in V8 via mini-racer)
        run: uv run --no-project --with pytest --with mini-racer pytest -q tests
