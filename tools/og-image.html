<!doctype html>
<!-- Source of assets/og.png (1200x630). Regenerate:
     firefox --headless --no-remote --profile _shots/prof --window-size=1200,630 \
       --screenshot assets/og.png file://$PWD/tools/og-image.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0a5141; color: #fff; font-family: Inter, sans-serif; display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 48px; padding: 0 72px; box-sizing: border-box; }
  .brand { font-weight: 700; font-size: 30px; margin-bottom: 36px; }
  .brand span { color: #f0a92e; }
  h1 { font-size: 64px; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 24px; }
  p { font-size: 26px; color: #d5ebe3; margin: 0; line-height: 1.35; }
  .card { background: #fff; color: #14211d; border-radius: 22px; padding: 28px; }
  .label { font-size: 17px; color: #5a6964; font-weight: 500; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; align-items: center; font-size: 19px; margin-top: 12px; }
  .track { height: 14px; border-radius: 99px; background: #f0eee6; overflow: hidden; }
  .fill { height: 100%; background: #0e6b53; border-radius: 99px; }
  .val { text-align: right; font-weight: 700; }
  .loss { color: #c23d2a; }
  .alert { margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: #fbe9e6; font-size: 18px; }
  .note { font-size: 14px; color: #5a6964; margin-top: 18px; }
</style>
</head>
<body>
  <div>
    <div class="brand">Dados <span>à Vista</span></div>
    <h1>Você sabe quanto sobra de cada venda?</h1>
    <p>Painel de lucro real por produto e canal, atualizado sozinho todo dia.</p>
  </div>
  <div class="card">
    <p class="label">Margem líquida por canal</p>
    <div class="row"><span>Loja própria</span><span class="track"><span class="fill" style="display:block;width:100%"></span></span><span class="val">11,8%</span></div>
    <div class="row"><span>Shopee</span><span class="track"><span class="fill" style="display:block;width:32%"></span></span><span class="val">3,8%</span></div>
    <div class="row"><span>Mercado Livre</span><span class="track"><span class="fill" style="display:block;width:24%"></span></span><span class="val">2,8%</span></div>
    <div class="alert">Película de vidro na Shopee: <strong class="loss">-20,9%</strong> por venda</div>
    <p class="note">Loja fictícia, últimos 12 meses</p>
  </div>
</body>
</html>
